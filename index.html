<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多标签页共享任务板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loading" class="loading">正在初始化共享任务板…</div>

    <header class="topbar">
      <div>
        <h1>多标签页共享任务板</h1>
        <p>同一浏览器的多个标签页通过 IndexedDB、Web Locks 与 BroadcastChannel 协作。</p>
      </div>
      <div class="session-bar">
        <span id="sessionBadge" class="session-badge" aria-live="polite"></span>
        <span id="connectionPill" class="pill online" aria-live="polite"></span>
        <button id="offlineToggle" class="btn secondary" type="button">模拟离线</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel canvas-panel">
        <div class="panel-heading">
          <h2>任务状态可视化</h2>
          <span id="canvasSummary" class="muted"></span>
        </div>
        <div class="canvas-wrap">
          <canvas id="statusCanvas" role="img" aria-label="任务状态图"></canvas>
        </div>
      </section>

      <div class="workspace">
        <section class="panel tasks-panel">
          <div class="panel-heading">
            <h2>任务</h2>
          </div>

          <form id="createForm" class="create-form">
            <input id="taskTitle" type="text" maxlength="80" placeholder="新任务标题" required />
            <select id="taskPriority" aria-label="优先级">
              <option value="high">高优先级</option>
              <option value="normal" selected>普通</option>
              <option value="low">低优先级</option>
            </select>
            <button class="btn primary" type="submit">创建任务</button>
          </form>

          <div class="filters">
            <input id="searchInput" type="search" placeholder="搜索标题或描述" />
            <select id="statusFilter" aria-label="按状态过滤">
              <option value="all">全部状态</option>
              <option value="unclaimed">待认领</option>
              <option value="claimed">已认领</option>
              <option value="completed">已完成</option>
            </select>
            <select id="ownerFilter" aria-label="按标签页过滤">
              <option value="all">全部标签页</option>
              <option value="unclaimed">仅待认领</option>
              <option value="mine">本标签页</option>
            </select>
            <select id="sortSelect" aria-label="排序">
              <option value="newest">最新创建优先</option>
              <option value="oldest">最早创建优先</option>
              <option value="priority">按优先级</option>
              <option value="title">按标题</option>
            </select>
          </div>

          <div id="taskList" class="task-list" aria-live="polite"></div>
        </section>

        <aside class="side-column">
          <section class="panel">
            <div class="panel-heading">
              <h2>标签页</h2>
              <span id="tabCount" class="muted"></span>
            </div>
            <div id="tabList" class="tab-list"></div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>离线认领队列</h2>
            </div>
            <div id="queueList"></div>
          </section>
        </aside>
      </div>
    </main>

    <div id="editModal" class="modal" hidden>
      <form id="editForm" class="modal-card">
        <h2>编辑任务</h2>
        <input type="hidden" id="editTaskId" />
        <label>
          标题
          <input id="editTitle" type="text" maxlength="80" required />
        </label>
        <label>
          描述
          <textarea id="editDescription" rows="3" maxlength="300"></textarea>
        </label>
        <label>
          优先级
          <select id="editPriority">
            <option value="high">高优先级</option>
            <option value="normal">普通</option>
            <option value="low">低优先级</option>
          </select>
        </label>
        <div class="modal-actions">
          <button id="editCancel" class="btn secondary" type="button">取消</button>
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js" defer></script>
  </body>
</html>
